name: App Builder
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v2
        with:
          version: 9.12.1

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Use the pushed git tag (v1.6.28.1), not Cargo/npm's 1.6.28+1 SemVer.
          tagName: ${{ github.ref_name }}
          releaseName: "Kuantframe ${{ github.ref_name }}"
          releaseBody: |
            Windows installers for **Kuantframe** v1.6.28.1 (Quantframe fork).

            App/Cargo version is `1.6.28+1` (valid SemVer). Windows file version and this release tag are **1.6.28.1**.

            ### Download
            - **NSIS** `.exe` installer (recommended)
            - **MSI** installer if you prefer

            Install, then open Kuantframe from the Start Menu / Desktop shortcut.

            ### What's new
            - Discord contact in README and GitHub issue templates
            - Settings → General: copy official Quantframe save data into Kuantframe (confirm, backup existing data, then restart)

            ### Important
            Do **not** run `src-tauri\target\debug\Kuantframe.exe` from a source checkout. That debug build expects Vite on localhost and shows a blank window / `localhost refused to connect`. Use this installer (or `pnpm run tauri:dev` when developing).

            ### Blank slate
            This build ships **no personal data**: no login, stock/items, settings, or webhooks.
            First launch creates empty defaults in `%LOCALAPPDATA%\dev.kuantframe`.

            ### Notes
            - Separate from official Quantframe (`dev.kenya.quantframe`)
            - Login/cache still use `https://api.quantframe.app`
            - Windows SmartScreen may warn (unsigned) — More info → Run anyway if you trust the source
          releaseDraft: false
          prerelease: false
          args: ""
