name: App Builder
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v2
        with:
          version: 9.12.1

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Kuantframe v__VERSION__"
          releaseBody: |
            Windows download for Kuantframe (Quantframe fork).

            Install the `.exe` NSIS installer, or use the `.msi` if you prefer.
            App data lives in `%LOCALAPPDATA%\dev.kuantframe` (separate from official Quantframe).
          releaseDraft: false
          prerelease: false
          args: ""
